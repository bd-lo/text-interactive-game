# CI 质量门与许可证门禁（第 17 章 §17.2 004-ci-license-gate、第 18 章 §18.6、第 19 章 §19.5）
# 规则：环境一律 `uv sync --frozen`（第 19 章 §19.1）；不用 pip 临时装包；不跑真实 LLM 调用。
#
# Action 版本策略（2026-11-11 D1 升级）：**固定精确语义版本**（不写 floating major tag）——
#   - astral-sh/setup-uv 自 v8 起已不再发布 major/minor tag（官方安全声明），必须精确版本；
#   - 其余 action 同样按精确补丁版本固定，升级必须显式改本文件并经 CI 验证（不可被上游静默推进）。
# 本轮由 v4/v6 系升级到 Node24 运行时（checkout v7 / setup-uv v10 / upload-artifact v7 /
# pnpm-action-setup v6 / setup-node v7），消除 runner 上「Node.js 20 is deprecated」警告；
# 各 action 的既有输入（python-version / node-version / cache / version / name/path/if-no-files-found）
# 在新版本中均保留，行为不变（v10 的 enable-cache 默认 auto 在 push/PR 下仍启用缓存）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 同一 PR/分支的新提交取消旧运行，避免过期运行占用并发额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 质量门：lint → type → 分层依赖契约 → 测试，Python 3.10/3.12 双矩阵（第 18 章 §18.6）
  quality:
    name: quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Q9 定案（2026-11-09）：GitHub 托管 runner 为临时容器边界 + 单 job 超时兜底；
    # 测试套件由 tests/conftest.py 的 socket guard 默认禁网（真实 LLM 一律 FakeLLM/cassette，
    # 本 job 不注入任何密钥）。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1
      - name: 安装 uv 与 Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: 同步锁定依赖（按矩阵指定解释器）
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: 矩阵证据（确认实际 Python 版本）
        run: uv run python -VV
      - name: 格式检查（ruff format）
        run: uv run ruff format --check .
      - name: Lint（ruff check）
        run: uv run ruff check .
      - name: 类型检查（mypy strict，源码保持 3.10 兼容）
        run: uv run mypy src/textgame
      - name: 分层依赖契约（import-linter）
        run: uv run lint-imports
      - name: 单元与集成测试（pytest）
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee pytest.log
      - name: 覆盖率门禁（C-1：D-M5-9 到期承诺，CI 专用，不改 pyproject addopts）
        # quality 已按 3.10/3.12 双矩阵各跑一次全量；覆盖率门只需一份，固定 3.12 跑（省 CI 时间）
        if: matrix.python-version == '3.12'
        run: uv run pytest -q --cov=textgame --cov-report=term-missing --cov-fail-under=80
      - name: 文档一致性门禁（C-2：开发文档拼接/进度索引/下一编号）
        run: uv run python scripts/check_docs.py
      - name: 失败摘要（写入 Check 注解，便于公开仓库定位失败用例）
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          log = Path("pytest.log")
          if not log.exists():
              print("::error title=pytest::pytest.log missing (pytest did not start)")
              raise SystemExit(0)

          lines = [ln for ln in log.read_text(encoding="utf-8", errors="replace").splitlines() if ln.strip()]
          head = [ln for ln in lines if ln.startswith(("FAILED", "ERROR"))][:20]
          tail = lines[-30:]
          seen = set()
          for ln in head + tail:
              if ln in seen:
                  continue
              seen.add(ln)
              msg = ln.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=pytest::{msg}")
          PY

  # 依赖门：许可证白名单 + 漏洞审计 + SBOM，产物存 artifact（第 18 章 §18.6、第 19 章 §19.5）
  deps:
    name: deps (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1
      - name: 安装 uv 与 Python 3.12
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: 同步锁定依赖（固定 3.12）
        run: uv sync --frozen --python "3.12"
      - name: 导出锁定依赖清单（requirements 文本）
        run: |
          mkdir -p artifacts
          uv export --frozen --no-hashes --format requirements-txt > artifacts/requirements.lock.txt
      - name: 生成许可证清单（pip-licenses）
        run: uv run pip-licenses --format=json --with-urls > artifacts/licenses.json
      - name: 许可证门禁（GPL/AGPL/未知即阻断，第 19 章 §19.5）
        run: uv run python scripts/check_licenses.py artifacts/licenses.json
      - name: 漏洞审计（pip-audit）
        run: uv run pip-audit -r artifacts/requirements.lock.txt
      - name: 生成 SBOM（CycloneDX JSON）
        # cyclonedx-python-lib（pyproject 已锁）只是库，不含 CLI；CLI 在 cyclonedx-bom。
        # 本切片禁改 pyproject/uv.lock，故用 `uv run --with` 临时覆盖环境（不写入 lock、不改 .venv），
        # 版本 pin 到 8.0.1 以保证 SBOM 输出可复现。
        run: uv run --with 'cyclonedx-bom==8.0.1' cyclonedx-py environment --of JSON -o artifacts/sbom.json
      - name: 上传 SBOM 与许可证/审计报告
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom-licenses
          path: artifacts/
          if-no-files-found: warn

  # 前端构建门（M6-025、D-M6-5④）：lockfile 锁装 → 类型检查 → 构建 web/dist → 单元测试。
  # Node 基线：本机 Node 26.10.0；若 runner 暂不支持 26，可将 node-version 降为 "24"
  #（第 23 章 §23.2 的 LTS 基线；vite 8 / vitest 5 的 engines 均接受 24/26，产物语义不变）。
  # 运行期零 Node/pnpm：本 job 只产出 web/dist，由 FastAPI 托管（D-M6-5②）。
  web-build:
    name: web-build (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1
      - name: 安装 pnpm 12.6.0（与 lockfile 生成器一致；不用 packageManager/corepack）
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.6.0
      - name: 安装 Node（仅构建期）
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装前端依赖（锁定）
        run: pnpm --dir web install --frozen-lockfile
      - name: 类型检查（vue-tsc）
        run: pnpm --dir web typecheck
      - name: 构建（产出 web/dist）
        run: pnpm --dir web build
      - name: 构建产物校验（SPA 入口存在）
        run: test -f web/dist/index.html && ls -lh web/dist/assets
      - name: dist 漂移门禁（web/dist 入库产物必须与 pnpm build 输出一致，D10）
        # web/dist 由 Lead 在集成时统一入库（fresh clone 无 Node 可玩网页版）。
        # 本门禁防止「改了 web/src 但忘记重建/提交 dist」；.gitattributes 的
        # `web/dist/** -text -diff`（OSS 任务同批提交）避免换行/二进制误判。
        # 过渡期：dist 尚未入库时本步骤通过；入库后构建产物与提交内容不一致即失败。
        run: |
          echo "== web/dist 相对 HEAD 的变化 =="
          git status --porcelain -- web/dist
          if [ -n "$(git status --porcelain -- web/dist)" ]; then
            echo "::error::web/dist 与 pnpm build 输出不一致：请本地重建并提交构建产物（D10）。"
            exit 1
          fi
          git diff --exit-code -- web/dist
      - name: 单元测试（vitest：幂等键/版本链/错误契约/安全静态扫描）
        run: pnpm --dir web test
      - name: 安装 uv（浏览器 E2E 临时服务运行时；仅 CI 用）
        uses: astral-sh/setup-uv@v10.3.3
      - name: 同步 Python 运行时依赖（uv sync --no-dev，起临时 uvicorn 用）
        run: uv sync --frozen --no-dev
      - name: 浏览器 E2E（临时 uvicorn :8794 + headless Chrome；失败上传日志）
        # H4-L6：把真实浏览器 e2e（零依赖 CDP 驱动）接入 CI web-build job。
        # ubuntu-latest 自带 Google Chrome；脚本会探测 /usr/bin/google-chrome。
        # 临时服务用离线确定性路径（TEXTGAME_LLM_ENABLED=false），静态资源用本 job 刚构建的 web/dist。
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e-web
          export TEXTGAME_DB_URL="sqlite:///$PWD/artifacts/e2e-web/e2e.db"
          export TEXTGAME_LLM_ENABLED=false
          uv run --no-dev uvicorn textgame.main:app --host 127.0.0.1 --port 8794 \
            > artifacts/e2e-web/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8794/healthz >/dev/null 2>&1; then READY=1; break; fi
            sleep 0.5
          done
          if [ "$READY" != "1" ]; then
            echo '::error::临时 uvicorn 未在 60s 内就绪'
            tail -n 80 artifacts/e2e-web/server.log || true
            exit 1
          fi
          node scripts/e2e-web.mjs --base-url http://127.0.0.1:8794 --out artifacts/e2e-web
      - name: 上传 E2E 证据（失败也上传）
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-web
          path: artifacts/e2e-web/
          if-no-files-found: warn
