# Alembic minimal config (M3 contract D-M3-6, task 5): baseline schema creation only.
#
# Usage (from repository root): uv run alembic upgrade head
# - Default URL matches Settings.db_url (sqlite:///data/textgame.db). Priority (see
#   alembic/env.py): config.attributes["sqlalchemy.url"] > ALEMBIC_DB_URL env var >
#   sqlalchemy.url in this file.
# - M2 databases already created by Base.metadata.create_all without alembic_version are
#   OUT of scope for this baseline (baseline == create all tables on an empty DB); the
#   legacy-DB migration strategy is registered by the Lead in PROGRESS section 5.
# - NOTE: keep this file pure ASCII: Alembic 1.20 reads the ini with the OS locale
#   encoding (gbk on zh-CN Windows), so UTF-8 comments would break `alembic` CLI.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
sqlalchemy.url = sqlite:///data/textgame.db
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
